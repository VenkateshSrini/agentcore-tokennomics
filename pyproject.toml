[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenomics-capture"
version = "0.1.0"
description = "Generic agent tokenomics capture module for Amazon Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.43.108",
    "botocore==1.43.108",
    "jmespath==1.1.0",
    "s3transfer==0.19.2",
    "sqlalchemy==2.1.3",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "greenlet==3.5.6",
    "starlette==1.7.0",
    "anyio==4.15.1",
    "uvicorn==0.54.0",
    "httptools==0.8.0",
    "watchfiles==1.3.0",
    "websockets==17.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "typing-extensions==4.16.0",
    "certifi==2026.7.22",
    "idna==3.20",
    "urllib3==2.8.0",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "annotated-types==0.8.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "typing-inspection==0.4.4",
    "sniffio==1.3.1",
]

[project.optional-dependencies]
# bedrock-agentcore is optional: the module works with a bare boto3 bedrock-runtime client.
agentcore = [
    "bedrock-agentcore==1.24.0",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.13.1",
    "httpcore2==2.13.1",
    "truststore==0.10.4",
    "h11==0.16.0",
    "pygments==2.21.0",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "colorama==0.4.6",
    "click==8.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tokenomics_capture"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
]
